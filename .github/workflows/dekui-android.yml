# Put this file at .github/workflows/dekui-android.yml in YOUR FORK of
# https://github.com/tgacquin/mm3d-dekui, then open the Actions tab and run
# "Dekui Android" (workflow_dispatch). The APK appears under "Artifacts".
#
# UNTESTED: written from the repo's own Gradle options (-PdekuiPresentation,
# -PdekuiQtRoot, -PdekuiQtHost). Expect to fix errors on the first runs.
name: Dekui Android
on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: Qt version (must exist for both android_arm64_v8a and linux_gcc_64)
        default: '6.8.3'
permissions:
  contents: read
concurrency:
  group: dekui-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Qt directly with the newest aqtinstall (the install-qt-action
      # bundles an old one that cannot list Android packages).
      - name: Install Qt (host + Android arm64)
        env:
          QTV: ${{ inputs.qt_version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --upgrade pip aqtinstall
          AQT="$RUNNER_TEMP/aqt-venv/bin/aqt"
          "$AQT" version
          echo "--- Qt versions offered for linux/android:"
          "$AQT" list-qt linux android || true
          echo "--- Android archs for $QTV:"
          "$AQT" list-qt linux android --arch "$QTV" || true
          "$AQT" install-qt linux desktop "$QTV" linux_gcc_64 -O "$RUNNER_TEMP/qt"
          "$AQT" install-qt linux android "$QTV" android_arm64_v8a -O "$RUNNER_TEMP/qt"
          ls "$RUNNER_TEMP/qt/$QTV"

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.3.13750724" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # A bundled SDL2 submodule ships a wrapper jar the validator rejects; unrelated to this build.
          validate-wrappers: false

      - name: Show Qt paths
        run: |
          ls "${{ runner.temp }}/qt/Qt/${{ inputs.qt_version }}" || ls "${{ runner.temp }}/qt/${{ inputs.qt_version }}"

      - name: Make owl text file optional (it is not in the repo)
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Make the optional owl-prompt text file (use.gmsg) optional in the Android setup.
          That file is derived from game text and is not in the repository, so the APK
          cannot bundle it. Without it, only Classic saving / Classic Double Time wording
          is unavailable; both are off by default."""
          import sys
          from pathlib import Path

          path = Path("src/android/app/src/main/java/org/citra/citra_emu/utils/DekuiGameSetup.kt")
          s = path.read_text()
          old1 = '''            context.assets.open("dekui-setup/project-restoration/romfs/message/us/use.gmsg").use {
                          owl.parentFile!!.mkdirs(); owl.outputStream().use { out -> it.copyTo(out) }
                      }
          '''
          new1 = '''            val hasOwl = try {
                          context.assets.open("dekui-setup/project-restoration/romfs/message/us/use.gmsg").use {
                              owl.parentFile!!.mkdirs(); owl.outputStream().use { out -> it.copyTo(out) }
                          }
                          true
                      } catch (_: java.io.FileNotFoundException) { false }
          '''
          old2 = "if (!existingOwl.isFile) {"
          new2 = "if (hasOwl && !existingOwl.isFile) {"
          if "val hasOwl" in s:
              print("already patched"); sys.exit(0)
          assert s.count(old1) == 1 and s.count(old2) == 1, "source changed; patch does not apply"
          path.write_text(s.replace(old1, new1).replace(old2, new2))
          print("patched", path)
          PY

      - name: Allow the cutout (notch) setting to be changed in-game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/android/app/src/main/java/org/citra/citra_emu/features/settings/model/BooleanSetting.kt")
          s = p.read_text()
          old = "            APPLY_REGION_FREE_PATCH,\n            EXPAND_TO_CUTOUT_AREA\n"
          new = "            APPLY_REGION_FREE_PATCH\n"
          if old in s:
              p.write_text(s.replace(old, new)); print("patched", p)
          elif "EXPAND_TO_CUTOUT_AREA\n        )" not in s:
              print("already patched")
          else:
              raise SystemExit("source changed; patch does not apply")
          PY

      - name: Fill the screen by default (stretch + notch area)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("src/android/app/src/main")

          def edit(rel, old, new, marker):
              p = base / rel
              s = p.read_text()
              if marker in s:
                  print("already patched", rel); return
              assert s.count(old) == 1, "source changed; patch does not apply: " + rel
              p.write_text(s.replace(old, new)); print("patched", rel)

          # Native: when aspect ratio is "Default", use Stretch instead (other choices still work).
          edit("jni/config.cpp",
               '    ReadSetting("Layout", Settings::values.aspect_ratio);\n',
               '    ReadSetting("Layout", Settings::values.aspect_ratio);\n'
               '#ifdef ENABLE_MM3D_PRESENTATION\n'
               '    if (Settings::values.aspect_ratio.GetValue() == Settings::AspectRatio::Default) {\n'
               '        Settings::values.aspect_ratio = Settings::AspectRatio::Stretch;\n'
               '    }\n'
               '#endif\n',
               "AspectRatio::Stretch;")

          # Kotlin: always draw into the notch/cutout area in this build.
          edit("java/org/citra/citra_emu/activities/EmulationActivity.kt",
               "            if (BooleanSetting.EXPAND_TO_CUTOUT_AREA.boolean) {\n",
               "            if (org.citra.citra_emu.BuildConfig.DEKUI_PRESENTATION || BooleanSetting.EXPAND_TO_CUTOUT_AREA.boolean) {\n",
               "BuildConfig.DEKUI_PRESENTATION || BooleanSetting.EXPAND")
          edit("java/org/citra/citra_emu/fragments/EmulationFragment.kt",
               "        if (!BooleanSetting.EXPAND_TO_CUTOUT_AREA.boolean) {\n",
               "        if (!(org.citra.citra_emu.BuildConfig.DEKUI_PRESENTATION || BooleanSetting.EXPAND_TO_CUTOUT_AREA.boolean)) {\n",
               "BuildConfig.DEKUI_PRESENTATION || BooleanSetting.EXPAND")
          PY

      - name: Build APK
        working-directory: src/android
        run: |
          QT_BASE="${{ runner.temp }}/qt/Qt/${{ inputs.qt_version }}"
          [ -d "$QT_BASE" ] || QT_BASE="${{ runner.temp }}/qt/${{ inputs.qt_version }}"
          chmod +x ./gradlew
          ./gradlew assembleVanillaRelease \
            -PdekuiPresentation=true \
            -PdekuiQtRoot="$QT_BASE/android_arm64_v8a" \
            -PdekuiQtHost="$QT_BASE/gcc_64" \
            --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find src/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: dekui-android-apk
          path: out/*.apk
          if-no-files-found: error
